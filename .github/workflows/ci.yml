# Build, test and release with KhaosSystems/unreal-actions. To release, merge the release pull
# request release-please keeps open; edit its CHANGELOG.md lines first.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['Marketing/**'] # Not part of the plugin; tags build regardless.
  pull_request:
    paths-ignore: ['Marketing/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Superseded pull request builds are cancelled. Pushes to main run to the end: the one that
  # merges the release pull request makes the release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    uses: KhaosSystems/unreal-actions/.github/workflows/plugin.yml@v1
    permissions:
      contents: write # releases and badges
      issues: write # release-please's labels
      pull-requests: write # the release pull request
    with:
      engine-versions: '["5.8"]'
      release-please: true
      publish-docs: true
    secrets:
      discord-webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
      docs-token: ${{ secrets.KHAOS_DOCS_TOKEN }}
